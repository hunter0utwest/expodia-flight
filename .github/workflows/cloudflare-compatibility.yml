name: Cloudflare Compatibility

on:
  push:
    branches:
      - cloudflare/prepare
  pull_request:
    branches:
      - main

jobs:
  cloudflare-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Next.js compatibility check
        run: npx vinext check
      - name: Cloudflare production build
        run: npx vinext build
