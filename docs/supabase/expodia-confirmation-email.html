<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Confirm your Expodia account</title></head>
<body style="margin:0;background:#f5f2ed;color:#171513;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:620px;margin:40px auto;padding:0 20px">
    <div style="background:#171513;color:#fff;padding:18px 22px;border-radius:18px 18px 0 0;font-weight:800;letter-spacing:-.02em">EXPODIA FLIGHTS</div>
    <div style="background:#fff;padding:34px 28px;border:1px solid #e4dfd8;border-top:0;border-radius:0 0 18px 18px">
      <p style="font-size:12px;letter-spacing:.14em;font-weight:700;color:#766f68">EMAIL CONFIRMATION</p>
      <h1 style="font-size:30px;line-height:1.05;margin:8px 0 14px">Confirm your Expodia account</h1>
      <p style="font-size:16px;line-height:1.6;color:#5d5751">Confirm your email address to finish creating your traveler space and return directly to Expodia.</p>
      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#171513;color:#fff;text-decoration:none;padding:13px 18px;border-radius:10px;font-weight:700">Confirm email address</a></p>
      <p style="font-size:12px;line-height:1.5;color:#857e76">If you did not create an Expodia account, you can ignore this email.</p>
    </div>
  </div>
</body>
</html>
